version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: pawncalc-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pawncalc

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawncalc-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pawncalc
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}

  frontend:
    image: node:20-alpine
    container_name: pawncalc-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  mongo-data:
